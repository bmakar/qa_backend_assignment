# Copy this file to gitlab.properties (same directory: src/main/resources/) and fill in your
# own values. gitlab.properties is git-ignored - it exists so a personal token or project id
# never has to touch a system property or an environment variable during local development.
# Every value here can still be overridden per-run with -Dgitlab.xxx or an environment variable;
# see Config's javadoc for the full resolution order.

gitlab.token=<your personal access token, scope: api>

# Optional. Omit to have the suite create and delete a scratch project for the run.
gitlab.projectId=<your project id>
