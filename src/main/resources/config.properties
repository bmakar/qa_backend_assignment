# Non-secret defaults for the GitLab API client. Committed - never put a token or a real
# project id in this file. See Config's javadoc for the full resolution order; every key here
# can still be overridden per-run with a system property (-Dgitlab.xxx) or an environment
# variable (GITLAB_XXX).
gitlab.baseUri=https://gitlab.com
gitlab.basePath=/api/v4
