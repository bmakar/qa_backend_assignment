# Test classes run concurrently, methods within a class run sequentially.
# Rationale: gitlab.com rate-limits aggressively, so unbounded method-level parallelism turns into
# 429s and flaky runs. Class-level concurrency gives most of the wall-clock win at a fraction of the
# request rate.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Readable report names: createsIssueWithTitleOnly -> "Creates issue with title only".
# A real, published generator (junit-pioneer), not a hand-rolled one - see FINDINGS.md for what
# happened the first time this pointed at a class that only existed in JUnit's documentation.
#
# Known, verified limitation: a lone single-letter word directly followed by a capitalized word
# loses its trailing space, e.g. reportsTotalsForAScopedCollection -> "for ascoped collection"
# (should be "for a scoped collection"). Confirmed by running the real JUnit Platform launcher
# against every affected method currently in this suite - 6 of 121 come out mildly garbled this
# way; every other method renders correctly. Cosmetic only: it does not change which test ran or
# whether it passed, so it was accepted rather than renaming methods to dodge a report-formatting
# quirk. Not yet tested against a genuine multi-letter acronym (JSON, HTTP) - none exists in any
# current method name.
junit.jupiter.displayname.generator.default=org.junitpioneer.jupiter.displaynamegenerator.ReplaceCamelCaseAndUnderscoreAndNumber
