name: API Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily. An external API is a moving target: a monthly run tells you it broke
    # sometime in the last month, which is not actionable.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "JUnit tag filter, e.g. !slow"
        required: false
        default: ""

# A second push must not run the suite against the same project concurrently - the
# listing tests would see each other's data.
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every test now needs a live token, and secrets are not exposed to a fork's pull request - so
  # this is the only signal a fork can get. Compilation is not much, but it beats no feedback:
  # it catches a broken build before a maintainer has to run the live suite to discover it.
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile main and test sources
        run: mvn --batch-mode --no-transfer-progress test-compile

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write to push the generated Allure report to the gh-pages branch;
    # checks: write for action-junit-report's check run and allure-action's quality gate;
    # pull-requests: write for allure-action's PR comment.
    permissions:
      contents: write
      checks: write
      pull-requests: write
    # Secrets are not exposed to workflows triggered by a fork's pull request, so the
    # job would fail on a missing token rather than on anything meaningful. Skip it
    # there and let the compile job be the signal.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Fail early with a clear message if the token is missing
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::Repository secret GITLAB_TOKEN is not set. Add a PAT with the 'api' scope under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run API tests
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          # Optional. When unset, the suite creates and deletes a scratch project.
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
        run: |
          mvn --batch-mode --no-transfer-progress test \
            ${{ inputs.groups != '' && format('-Dgroups={0}', inputs.groups) || '' }}

      - name: Publish results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Live API test results
          detailed_summary: true

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Live API tests"
            echo
            bash ./scripts/test-summary.sh || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
          if-no-files-found: error

      # Raw Allure results, so a failed run can be rendered locally with `allure serve`
      # even when the Pages publish below is skipped.
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14
          if-no-files-found: error

      # Pull the previous report's history/ forward. Without this the trend and flakiness
      # graphs are permanently empty, which is most of the reason to run Allure at all.
      - name: Restore Allure history
        uses: actions/checkout@v4
        if: always() && github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # simple-elf/allure-report-action used to build the report by shelling into a Docker
      # image (openjdk:8-jre-alpine), which Docker Hub has since pulled. Built directly with
      # the Allure CLI instead, copying the restored history/ into the results first.
      - name: Copy previous Allure history
        if: always() && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          mkdir -p target/allure-results/history
          cp -r gh-pages/history/. target/allure-results/history/ 2>/dev/null || true

      - name: Install Allure commandline
        if: always() && github.ref == 'refs/heads/master'
        run: npm install -g allure-commandline

      - name: Build Allure report
        if: always() && github.ref == 'refs/heads/master'
        run: allure generate target/allure-results --clean -o allure-report

      - name: Publish Allure report to Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Run Allure Action
        uses: allure-framework/allure-action@v0
        if: always() && github.ref == 'refs/heads/master'
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sections: |
            new
            flaky